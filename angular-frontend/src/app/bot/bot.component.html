<div class="p-3">
  <div class="card">
    <div class="card-body">
      <div style="display: flex; gap: 8px;">
        <input [(ngModel)]="query" type="text" class="form-control" placeholder="Ask the assistant..." style="width: 85%;">
        <button class="btn btn-primary" (click)="askAgentStream()">
          <i class="bi bi-search"></i>
        </button>
      </div>

      @if (loadingService.isLoading()) {
        <div class="spinner-border text-primary mt-3" role="status"></div>
      }

      <div class="mt-3">
        <markdown [data]="response"></markdown>
      </div>
    </div>
  </div>
</div>
