spring.application.name=ebank-bot
server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.jersey.enabled=false

spring.cloud.config.enabled=false

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini

spring.ai.mcp.client.streamable-http-connections.customer.url=http://localhost:8081/mcp
spring.ai.mcp.client.streamable-http-connections.account.url=http://localhost:8082/mcp

telegram.enabled=true
telegram.bot.token=${TELEGRAM_BOT_TOKEN}

discord.enabled=true
discord.token=${DISCORD_BOT_TOKEN}
